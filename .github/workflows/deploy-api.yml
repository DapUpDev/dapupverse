# Ships the FastAPI service on every push to main that touches it.
#
# Ownership contract with Terraform (infra/):
#   - Terraform owns the task definition's SHAPE (cpu, memory, env, roles,
#     health check, logging) and everything around it.
#   - This workflow owns only the IMAGE: it downloads the current task
#     definition (including its tags), swaps the image (and APP_VERSION)
#     and registers a new revision. It never edits any other field, so a
#     later `terraform plan` is a no-op (`track_latest = true` on the task
#     definition).
#
# Auth: GitHub OIDC -> STS AssumeRoleWithWebIdentity. No AWS keys stored in
# GitHub. The role's trust policy only accepts tokens minted for this
# repository on `main`, so a run from a fork, PR, or other branch cannot
# obtain credentials even if it copies this file.

name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch: # manual redeploy of the current commit

# One deploy at a time; a newer push waits rather than racing.
concurrency:
  group: deploy-api-prod
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2
  AWS_ROLE_ARN: arn:aws:iam::645674817735:role/dapup-prod-github-deploy
  ECR_REPOSITORY: dapup-api
  ECS_CLUSTER: dapup-prod
  ECS_SERVICE: dapup-prod-api
  TASK_FAMILY: dapup-prod-api
  CONTAINER_NAME: api
  WORKER_SERVICE: dapup-prod-worker
  WORKER_FAMILY: dapup-prod-worker
  WORKER_CONTAINER: worker
  HEALTH_URL: https://api.dapup.space/health

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # A real PostgreSQL for the database tests (migrations, /me, /ready).
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: dapup_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:test@localhost:5432/dapup_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.10" # matches the Dockerfile
      - run: uv sync --locked
      - run: uv run pytest -q

  deploy:
    name: Build, push, deploy
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required to request the OIDC token
    steps:
      - uses: actions/checkout@v4

      - name: Assume the deploy role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Same 12-char short SHA convention as the manual bootstrap push.
      - name: Compute image tag
        id: tag
        run: echo "sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build and push linux/amd64 image
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.sha }}
          provenance: false # single-manifest image; ECR scans it as such
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --include TAGS + the jq merge carry Terraform's tags onto the new
      # revision; without them the revision is untagged and `terraform plan`
      # reports tag drift after every deploy.
      - name: Download the current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$TASK_FAMILY" --include TAGS \
            --query '{taskDefinition: taskDefinition, tags: tags}' \
            | jq '.taskDefinition + {tags: .tags}' > task-definition.json

      - name: Swap in the new image
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.sha }}
          environment-variables: |
            APP_VERSION=${{ steps.tag.outputs.sha }}

      - name: Register revision and roll the service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true
          wait-for-minutes: 10

      # The queue worker runs the same image with a different command, so it
      # gets the same treatment: copy its current task definition, swap the
      # image, register, roll. Its family and service are created by
      # Terraform; until they exist (the first deploy after the worker PR
      # merges) this step just says so and moves on.
      - name: Roll the worker onto the same image
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.sha }}
          VERSION: ${{ steps.tag.outputs.sha }}
        run: |
          active=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$WORKER_SERVICE"             --query 'services[?status==`ACTIVE`].serviceName' --output text)
          if [ "$active" != "$WORKER_SERVICE" ]; then
            echo "worker service not created yet (terraform apply pending); skipping"; exit 0
          fi
          aws ecs describe-task-definition --task-definition "$WORKER_FAMILY" --include TAGS             --query '{taskDefinition: taskDefinition, tags: tags}'             | jq --arg image "$IMAGE" --arg version "$VERSION" --arg name "$WORKER_CONTAINER" '
                .taskDefinition + {tags: .tags}
                | .containerDefinitions |= map(
                    if .name == $name then
                      .image = $image
                      | .environment |= map(if .name == "APP_VERSION" then .value = $version else . end)
                    else . end)
                | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities,
                      .registeredAt, .registeredBy, .deregisteredAt)
              ' > worker-task-definition.json
          arn=$(aws ecs register-task-definition --cli-input-json file://worker-task-definition.json             --query taskDefinition.taskDefinitionArn --output text)
          echo "registered $arn"
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$WORKER_SERVICE" --task-definition "$arn" > /dev/null
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$WORKER_SERVICE"
          echo "worker rolled"

      # The circuit breaker rolls back a bad deploy on the AWS side; this
      # makes the workflow itself go red if the new version is not serving.
      - name: Smoke test
        run: |
          expected="${{ steps.tag.outputs.sha }}"
          for i in $(seq 1 12); do
            body=$(curl -fsS "$HEALTH_URL" || true)
            echo "$body"
            if echo "$body" | grep -q "\"version\":\"$expected\""; then
              echo "Live: $expected"; exit 0
            fi
            sleep 10
          done
          echo "::error::$HEALTH_URL never reported version $expected"; exit 1
